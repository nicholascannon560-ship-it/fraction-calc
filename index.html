<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Calculator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, #0a0a1a 0%, #12122e 50%, #0d1f3c 100%);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  .fc-wrap {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, #0b0b14 0%, #12122a 40%, #0f1a30 100%);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06), inset 0 1px 0 rgba(255,255,255,0.04);
    color: #e8e8f0;
    user-select: none;
  }
  .fc-display {
    background: rgba(0,0,0,0.35);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 14px;
    border: 1px solid rgba(255,255,255,0.06);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .fc-input {
    font-size: 24px;
    font-weight: 600;
    color: #fff;
    text-align: right;
    word-break: break-all;
    line-height: 1.3;
    min-height: 32px;
  }
  .fc-input .cursor {
    display: inline-block;
    width: 2px;
    height: 24px;
    background: #60a5fa;
    animation: blink 1s step-end infinite;
    vertical-align: bottom;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .fc-result-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
    min-height: 36px;
  }
  .fc-result-frac {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fc-result-whole {
    font-size: 22px;
    font-weight: 700;
    color: #34d399;
  }
  .fc-result-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .fc-result-stack .num, .fc-result-stack .den {
    font-size: 16px;
    font-weight: 700;
    color: #34d399;
    min-width: 20px;
    text-align: center;
  }
  .fc-result-stack .bar {
    width: 100%;
    min-width: 28px;
    height: 2px;
    background: linear-gradient(90deg, #34d399, #60a5fa);
    border-radius: 1px;
  }
  .fc-result-dec {
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
  }
  .fc-error {
    font-size: 12px;
    color: #f87171;
    text-align: right;
    margin-top: 4px;
    min-height: 16px;
  }
  .fc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .fc-btn {
    height: 56px;
    border-radius: 16px;
    border: none;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .fc-btn:active { transform: scale(0.94); }
  .fc-btn-num {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .fc-btn-num:hover { background: rgba(255,255,255,0.13); }
  .fc-btn-op {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 4px 14px rgba(99,102,241,0.3);
  }
  .fc-btn-op:hover { filter: brightness(1.15); }
  .fc-btn-op.active {
    box-shadow: 0 0 0 3px rgba(139,92,246,0.4);
    filter: brightness(1.2);
  }
  .fc-btn-action {
    background: linear-gradient(135deg, #f472b6, #ec4899);
    box-shadow: 0 4px 14px rgba(236,72,153,0.3);
    font-size: 22px;
  }
  .fc-btn-action:hover { filter: brightness(1.15); }
  .fc-btn-sec {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    color: #94a3b8;
    font-size: 18px;
  }
  .fc-btn-sec:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .fc-btn-preset {
    height: 40px;
    font-size: 15px;
    background: rgba(52,211,153,0.10);
    border: 1px solid rgba(52,211,153,0.25);
    color: #6ee7b7;
  }
  .fc-btn-preset:hover { background: rgba(52,211,153,0.2); }
  .fc-btn-tool {
    grid-column: span 2;
    height: 44px;
    font-size: 15px;
    background: rgba(96,165,250,0.12);
    border: 1px solid rgba(96,165,250,0.3);
    color: #93c5fd;
  }
  .fc-btn-tool:hover { background: rgba(96,165,250,0.22); }
  .fc-error.info { color: #94a3b8; }
  .fc-error.up { color: #fbbf24; font-weight: 600; font-size: 13px; }
  .fc-error.down { color: #60a5fa; font-weight: 600; font-size: 13px; }
  .fc-btn-preset { -webkit-touch-callout: none; -webkit-user-select: none; touch-action: manipulation; }
  .fc-btn-preset.held { background: rgba(248,113,113,0.25); border-color: rgba(248,113,113,0.55); color: #fca5a5; }
  .fc-hint {
    text-align: center;
    font-size: 11px;
    color: #475569;
    margin-top: 12px;
    letter-spacing: 0.3px;
  }
  .fc-hint kbd {
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: inherit;
    color: #94a3b8;
  }
  .fc-tip { margin-top:14px; text-align:center; }
  .fc-tip-link { background:none; border:0; color:#94a3b8; font-size:14px; font-family:inherit; text-decoration:underline; cursor:pointer; padding:6px; }
  .fc-tip-box { margin-top:10px; display:none; }
  .fc-tip-box.open { display:block; }
  .fc-tip-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .fc-tip-row button, .fc-tip-go { background:rgba(96,165,250,0.15); color:#e8e8f0; border:1px solid rgba(96,165,250,0.35); border-radius:12px; padding:10px 14px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; }
  .fc-tip-custom { display:flex; gap:8px; justify-content:center; margin-top:8px; }
  .fc-tip-custom input { width:110px; background:rgba(0,0,0,0.35); color:#fff; border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:10px; font-size:16px; font-family:inherit; text-align:center; user-select:text; }
  .fc-tip-msg { margin-top:8px; font-size:13px; color:#94a3b8; min-height:16px; }
</style>
</head>
<body>
<div class="fc-wrap">
  <div class="fc-display">
    <div class="fc-input" id="disp"><span class="cursor"></span></div>
    <div class="fc-result-wrap" id="resWrap"></div>
    <div class="fc-error" id="err"></div>
  </div>

  <div class="fc-grid">
    <button class="fc-btn fc-btn-preset" onclick="addFrac(1,16)">1/16</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(1,8)">1/8</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(3,16)">3/16</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(1,4)">1/4</button>

    <button class="fc-btn fc-btn-preset" onclick="addFrac(5,16)">5/16</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(3,8)">3/8</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(7,16)">7/16</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(1,2)">1/2</button>

    <button class="fc-btn fc-btn-preset" onclick="addFrac(9,16)">9/16</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(5,8)">5/8</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(11,16)">11/16</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(3,4)">3/4</button>

    <button class="fc-btn fc-btn-preset" onclick="addFrac(13,16)">13/16</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(7,8)">7/8</button>
    <button class="fc-btn fc-btn-preset" onclick="addFrac(15,16)">15/16</button>
    <span></span>
    <button class="fc-btn fc-btn-tool" onclick="toNearest16()">≈ 1/16</button>
    <button class="fc-btn fc-btn-tool" onclick="decToFrac()">Dec → Frac</button>

    <button class="fc-btn fc-btn-sec" onclick="ac()">AC</button>
    <button class="fc-btn fc-btn-sec" onclick="back()">⌫</button>
    <button class="fc-btn fc-btn-sec" onclick="ins('/')">/</button>
    <button class="fc-btn fc-btn-sec" onclick="ins('.')">.</button>

    <button class="fc-btn fc-btn-num" onclick="ins('7')">7</button>
    <button class="fc-btn fc-btn-num" onclick="ins('8')">8</button>
    <button class="fc-btn fc-btn-num" onclick="ins('9')">9</button>
    <button class="fc-btn fc-btn-op" id="btn-÷" onclick="setOp('÷')">÷</button>

    <button class="fc-btn fc-btn-num" onclick="ins('4')">4</button>
    <button class="fc-btn fc-btn-num" onclick="ins('5')">5</button>
    <button class="fc-btn fc-btn-num" onclick="ins('6')">6</button>
    <button class="fc-btn fc-btn-op" id="btn-×" onclick="setOp('×')">×</button>

    <button class="fc-btn fc-btn-num" onclick="ins('1')">1</button>
    <button class="fc-btn fc-btn-num" onclick="ins('2')">2</button>
    <button class="fc-btn fc-btn-num" onclick="ins('3')">3</button>
    <button class="fc-btn fc-btn-op" id="btn-−" onclick="setOp('−')">−</button>

    <button class="fc-btn fc-btn-num" onclick="ins('0')">0</button>
    <button class="fc-btn fc-btn-num" onclick="ins(' ')">␣</button>
    <button class="fc-btn fc-btn-op" id="btn-+" onclick="setOp('+')">+</button>
    <button class="fc-btn fc-btn-action" onclick="calc()">=</button>
  </div>

  <div class="fc-hint">
    <kbd>25</kbd> <kbd>5/8</kbd> <kbd>1/16</kbd> → 25 11/16 · presets add to the current number
  </div>
  <div class="fc-tip">
    <button class="fc-tip-link" id="tipToggle" type="button">Leave a tip</button>
    <div class="fc-tip-box" id="tipBox">
      <div class="fc-tip-row">
        <button type="button" data-tip="2">$2</button>
        <button type="button" data-tip="5">$5</button>
        <button type="button" data-tip="10">$10</button>
      </div>
      <div class="fc-tip-custom">
        <input id="tipAmt" type="number" inputmode="decimal" min="1" step="1" placeholder="Other $">
        <button type="button" class="fc-tip-go" id="tipGo">Tip</button>
      </div>
      <div class="fc-tip-msg" id="tipMsg">Any amount, $1 or more. Paid securely through Square.</div>
    </div>
  </div>
</div>
<script>
(function(){
  const box=document.getElementById('tipBox'), msg=document.getElementById('tipMsg');
  document.getElementById('tipToggle').onclick=()=>box.classList.toggle('open');
  async function tip(dollars){
    const cents=Math.round(Number(dollars)*100);
    if(!(cents>=100)){msg.textContent='Enter $1 or more.';return;}
    if(cents>50000){msg.textContent='Max $500.';return;}
    msg.textContent='Opening checkout…';
    try{
      const r=await fetch('/tip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cents})});
      const j=await r.json();
      if(!r.ok||!j.url) throw new Error(j.error||'Checkout unavailable');
      location.href=j.url;
    }catch(e){msg.textContent=e.message||'Something went wrong, try again.';}
  }
  box.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>tip(b.dataset.tip));
  document.getElementById('tipGo').onclick=()=>tip(document.getElementById('tipAmt').value);
  if(new URLSearchParams(location.search).get('tipped')){box.classList.add('open');msg.textContent='Thank you for the tip!';history.replaceState(null,'','/');}
})();
</script>
<script>
  let input = '';
  let activeOp = null;

  function render() {
    document.getElementById('disp').innerHTML = (input || '') + '<span class="cursor"></span>';
    ['+','−','×','÷'].forEach(op => {
      const btn = document.getElementById('btn-' + op);
      if (btn) btn.classList.toggle('active', activeOp === op);
    });
  }

  function ins(ch) {
    input += ch;
    if ('+−×÷'.includes(ch)) activeOp = ch;
    render();
    autoCalc();
  }

  function setOp(op) {
    input = input.replace(/\s*[+\−×÷]\s*$/, '');
    input += ' ' + op + ' ';
    activeOp = op;
    render();
    autoCalc();
  }

  function back() {
    input = input.slice(0, -1);
    render();
    autoCalc();
  }

  function ac() {
    input = '';
    activeOp = null;
    document.getElementById('resWrap').innerHTML = '';
    document.getElementById('err').textContent = '';
    render();
  }

  function parseToken(tok) {
    tok = tok.trim();
    if (!tok) return null;
    const mixed = tok.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
    if (mixed) {
      const whole = parseInt(mixed[1]);
      const n = parseInt(mixed[2]);
      const d = parseInt(mixed[3]);
      if (d === 0) throw new Error('Zero denominator');
      const sign = whole < 0 ? -1 : 1;
      const num = Math.abs(whole) * d + n;
      return { num: sign * num, den: d };
    }
    const frac = tok.match(/^(-?\d+)\/(\d+)$/);
    if (frac) {
      const n = parseInt(frac[1]);
      const d = parseInt(frac[2]);
      if (d === 0) throw new Error('Zero denominator');
      return { num: n, den: d };
    }
    const dec = tok.match(/^(-?)(\d*)\.(\d*)$/);
    if (dec && (dec[2] || dec[3])) {
      const digits = (dec[2] || '') + (dec[3] || '');
      const num = parseInt(digits || '0', 10) * (dec[1] ? -1 : 1);
      return simplify({ num: num, den: Math.pow(10, dec[3].length) });
    }
    const whole = tok.match(/^(-?\d+)$/);
    if (whole) {
      return { num: parseInt(whole[1]), den: 1 };
    }
    throw new Error('Cannot parse "' + tok + '"');
  }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { let t = b; b = a % b; a = t; }
    return a;
  }

  function simplify(f) {
    const g = gcd(f.num, f.den);
    return { num: f.num / g, den: f.den / g };
  }

  function buildFracHTML(f) {
    if (f.den === 1) {
      return '<div class="fc-result-frac"><span class="fc-result-whole">' + f.num + '</span></div>';
    }
    const sign = f.num < 0 ? '-' : '';
    const an = Math.abs(f.num);
    const whole = Math.floor(an / f.den);
    const rem = an % f.den;
    let html = '<div class="fc-result-frac">';
    if (sign) html += '<span class="fc-result-whole" style="color:#f87171;margin-right:4px;">' + sign + '</span>';
    if (whole > 0) html += '<span class="fc-result-whole">' + whole + '</span>';
    if (rem > 0) {
      html += '<div class="fc-result-stack"><span class="num">' + rem + '</span><div class="bar"></div><span class="den">' + f.den + '</span></div>';
    }
    html += '</div>';
    return html;
  }

  function applyOp(a, op, b) {
    let num, den;
    switch (op) {
      case '+': num = a.num * b.den + b.num * a.den; den = a.den * b.den; break;
      case '−': num = a.num * b.den - b.num * a.den; den = a.den * b.den; break;
      case '×': num = a.num * b.num; den = a.den * b.den; break;
      case '÷': num = a.num * b.den; den = a.den * b.num; break;
      default: return null;
    }
    if (den === 0) throw new Error('Division by zero');
    const r = simplify({ num, den });
    if (r.den < 0) { r.num = -r.num; r.den = -r.den; }
    return r;
  }

  // Evaluates any length chain: 1/2 + 3/4 − 1/8 + 2 ...
  // × and ÷ go before + and −. A trailing operator is ignored so the
  // running total stays on screen while you type the next number.
  function doCalc() {
    const parts = input.split(/\s*([+\−×÷])\s*/).filter(s => s.trim() !== '');
    if ('+−×÷'.includes(parts[parts.length - 1])) parts.pop();
    if (parts.length < 3 || parts.length % 2 === 0) return null;
    const vals = [], ops = [];
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        const v = parseToken(parts[i]);
        if (!v) return null;
        vals.push(v);
      } else {
        ops.push(parts[i]);
      }
    }
    // pass 1: × ÷
    const v2 = [vals[0]], o2 = [];
    for (let i = 0; i < ops.length; i++) {
      if (ops[i] === '×' || ops[i] === '÷') v2[v2.length - 1] = applyOp(v2[v2.length - 1], ops[i], vals[i + 1]);
      else { o2.push(ops[i]); v2.push(vals[i + 1]); }
    }
    // pass 2: + − left to right
    let res = v2[0];
    for (let i = 0; i < o2.length; i++) res = applyOp(res, o2[i], v2[i + 1]);
    return res;
  }

  function autoCalc() {
    const errEl = document.getElementById('err');
    const resWrap = document.getElementById('resWrap');
    try {
      const result = doCalc();
      if (result) {
        const dec = (result.num / result.den).toFixed(6).replace(/\.?0+$/,'');
        resWrap.innerHTML = buildFracHTML(result) + '<span class="fc-result-dec">≈ ' + dec + '</span>';
        errEl.textContent = ''; errEl.classList.remove('info');
      } else {
        resWrap.innerHTML = '';
        errEl.textContent = '';
      }
    } catch(e) {
      resWrap.innerHTML = '';
      errEl.textContent = e.message;
    }
  }

  function calc() { autoCalc(); }

  // ---- presets / rounding helpers ----
  function fracToStr(f) {
    f = simplify(f);
    if (f.den < 0) { f.num = -f.num; f.den = -f.den; }
    const sign = f.num < 0 ? '-' : '';
    const an = Math.abs(f.num);
    const whole = Math.floor(an / f.den);
    const rem = an % f.den;
    if (rem === 0) return sign + whole;
    if (whole === 0) return sign + rem + '/' + f.den;
    return sign + whole + ' ' + rem + '/' + f.den;
  }

  // current number being typed (after the last operator)
  function splitLast() {
    const m = input.match(/^(.*\s[+\−×÷]\s)(.*)$/);
    return m ? { head: m[1], tail: m[2] } : { head: '', tail: input };
  }

  function note(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.classList.add('info');
  }

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.classList.remove('info');
  }

  // Preset buttons: always ADD the fraction to the number being typed.
  function addFrac(n, d) {
    const { head, tail } = splitLast();
    let cur = { num: 0, den: 1 };
    if (tail.trim()) {
      try { cur = parseToken(tail); }
      catch (e) { showErr('Finish the current entry first'); return; }
    }
    const sum = { num: cur.num * d + n * cur.den, den: cur.den * d };
    input = head + fracToStr(sum);
    render();
    autoCalc();
  }

  // Target for rounding/conversion: the answer if an expression is complete,
  // otherwise the number currently being typed.
  function getTarget() {
    let res = null;
    try { res = doCalc(); } catch (e) {}
    if (res) return { head: '', val: res, wasResult: true };
    const { head, tail } = splitLast();
    if (!tail.trim()) return null;
    try { return { head, val: parseToken(tail), wasResult: false }; }
    catch (e) { return null; }
  }

  function applyTarget(t, newVal, msg) {
    input = t.head + fracToStr(newVal);
    activeOp = null;
    render();
    autoCalc();
    if (msg) note(msg);
  }

  function toNearest16() {
    const t = getTarget();
    if (!t) { showErr('Nothing to round'); return; }
    const before = t.val.num / t.val.den;
    const r = simplify({ num: Math.round(before * 16), den: 16 });
    const exact = Math.abs(r.num / r.den - before) < 1e-9;
    applyTarget(t, r, exact ? '' : 'Rounded from ' + +before.toFixed(6) + ' to nearest 1/16');
  }

  function decToFrac() {
    const t = getTarget();
    if (!t) { showErr('Nothing to convert'); return; }
    let f = simplify(t.val);
    if (f.den < 0) { f.num = -f.num; f.den = -f.den; }
    if (f.den <= 16) { applyTarget(t, f, ''); return; }
    const before = f.num / f.den;
    const r = simplify({ num: Math.round(before * 16), den: 16 });
    applyTarget(t, r, '≈ nearest 1/16 (was ' + +before.toFixed(6) + ')');
  }

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key >= '0' && e.key <= '9') { e.preventDefault(); ins(e.key); }
    else if (e.key === '.') { e.preventDefault(); ins('.'); }
    else if (e.key === ' ') { e.preventDefault(); ins(' '); }
    else if (e.key === '/') { e.preventDefault(); ins('/'); }
    else if (e.key === '+') { e.preventDefault(); setOp('+'); }
    else if (e.key === '-') { e.preventDefault(); setOp('−'); }
    else if (e.key === '*') { e.preventDefault(); setOp('×'); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calc(); }
    else if (e.key === 'Backspace') { e.preventDefault(); back(); }
    else if (e.key === 'Escape') { e.preventDefault(); ac(); }
  });

  render();
</script>
</body>
</html>
